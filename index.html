<style>
:root{--bg:#faf7f3;--card:#fff;--ink:#231f20;--muted:#9b9295;--line:#efe9e4;--soft:#f4efea;--accent:#9e3039;--accent-soft:#f6e9ea;--ok:#3d7a57;--ok-soft:#e8f2ec;--bad:#b3373f;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit}
main{max-width:620px;margin:0 auto;padding:28px 18px 64px}
.lv{font-family:'Source Serif 4',Georgia,serif}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-family:'Source Serif 4',Georgia,serif;font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px}
.flag{width:22px;height:14px;border-radius:3px;background:linear-gradient(var(--accent) 40%,#fff 40% 60%,var(--accent) 60%);box-shadow:0 0 0 1px var(--line)}
.stat{font-size:13px;color:var(--muted)}
/* module picker */
.picker{position:relative;margin-bottom:18px}
.pick{all:unset;box-sizing:border-box;cursor:pointer;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:14px}
.pick .num{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.pick .meta{flex:1;min-width:0}
.pick .g{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pick .t{font-weight:600;font-size:16px}
.pick .chg{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:600}.pick .chev{transition:transform .2s;font-size:11px}.pick:hover{border-color:#d9cfc8}.pick:hover .chg{background:var(--accent)}
.picker.open .chev{transform:rotate(180deg)}
.bar{height:3px;background:var(--soft);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px rgba(60,30,30,.10);max-height:65vh;overflow:auto;z-index:10;padding:8px}
.picker.open .menu{display:block}
.menu input{width:100%;border:none;background:var(--soft);border-radius:10px;padding:10px 12px;font:inherit;outline:none;margin-bottom:6px}
.menu h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 10px 4px;font-weight:500}
.item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer}
.item:hover{background:var(--soft)}
.item.on{background:var(--accent-soft);color:var(--accent)}
.item .n{width:24px;font-size:12px;color:var(--muted)}
.item .tt{flex:1}
.ring{width:18px;height:18px}
/* tabs */
.tabs{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{all:unset;flex:1;text-align:center;cursor:pointer;padding:8px 0;font-size:13px;font-weight:500;color:var(--muted);border-radius:10px;transition:.15s}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 22px;min-height:340px;text-align:center}
.top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.dots{display:flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.dots i.f{background:var(--accent)}
.big{font-family:'Source Serif 4',Georgia,serif;font-size:34px;font-weight:500;line-height:1.2;margin:34px 0 8px;word-break:break-word}
.en{color:var(--muted);font-size:17px;min-height:26px}
.row{display:flex;gap:10px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;padding:11px 22px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card)}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.spk{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;background:var(--soft);display:inline-grid;place-items:center;vertical-align:middle;margin-left:8px}
.spk svg{width:16px;height:16px}
/* flip card */
.flip{perspective:1000px;margin-top:18px;cursor:pointer}
.flip .in{position:relative;height:190px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;background:var(--soft);display:grid;place-items:center;padding:16px}
.face.b{transform:rotateY(180deg);background:var(--accent-soft)}
.face .big{margin:0}
.hint{font-size:12px;color:var(--muted);margin-top:12px}
/* lists */
.list{text-align:left}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border:none}
.li .ic{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--muted);display:grid;place-items:center;transition:.15s}
.li .ic svg{width:14px;height:14px}
.li:hover .ic{background:var(--accent-soft);color:var(--accent)}
.li.playing .ic{background:var(--accent);color:#fff}
.li.playing .a{color:var(--accent)}
.hintline{font-size:12px;color:var(--muted);text-align:left;margin:-6px 0 8px 4px}
.li .a{flex:1;font-family:'Source Serif 4',Georgia,serif;font-size:17px}
.li .b{color:var(--muted);text-align:right;font-size:14px;flex:1}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;margin:26px 0 4px}
/* quiz */
.opts{display:grid;gap:8px;margin-top:26px}
.opts button{all:unset;cursor:pointer;padding:14px 16px;border-radius:12px;background:var(--soft);text-align:left;transition:.15s}
.opts button:hover{background:#eee6df}
.opts .ok{background:var(--ok-soft);color:var(--ok)}.opts .bad{background:var(--accent-soft);color:var(--bad)}
/* write */
.field{width:100%;font:inherit;font-family:'Source Serif 4',Georgia,serif;font-size:24px;padding:12px 0;border:none;border-bottom:2px solid var(--line);outline:none;text-align:center;background:none;margin-top:22px}
.field:focus{border-color:var(--ink)}
.keys{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.keys button{all:unset;cursor:pointer;width:30px;height:30px;line-height:30px;border-radius:8px;background:var(--soft);font-size:14px}
.msg{margin-top:16px;min-height:24px;font-weight:500}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
/* builder */
.slot{min-height:64px;border-radius:14px;border:1.5px dashed var(--line);margin-top:24px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}
.pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;min-height:44px}
.tile{all:unset;cursor:pointer;padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-family:'Source Serif 4',Georgia,serif;font-size:17px;box-shadow:0 1px 0 var(--line)}
.slot .tile{background:var(--card)}
.ans{margin-top:16px;min-height:28px;font-family:'Source Serif 4',Georgia,serif;font-size:19px}
.empty{color:var(--muted);padding:60px 10px}
.nav{display:flex;gap:22px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.nav button{all:unset;cursor:pointer;padding:8px 0;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.nav button.on{color:var(--ink);border-color:var(--accent)}
[hidden]{display:none!important}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--muted);border-radius:9px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.board{background:#1f1b1c;color:#faf7f3;border-radius:22px;padding:26px 24px 24px;min-height:330px;display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(40,20,20,.12)}
.board .bt{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8d8386;letter-spacing:.06em}
.chip{padding:5px 10px;border-radius:999px;background:#2c2627;color:#e9c9cc;font-size:11.5px;letter-spacing:.04em}
.board .sfx{font-size:15px}.board .spk{background:#2c2627;color:#faf7f3;margin-left:6px}
.flapline{flex:1;display:flex;align-items:center;padding:26px 0}
.flap{font-family:'Source Serif 4',Georgia,serif;font-size:clamp(26px,6vw,40px);font-weight:500;line-height:1.3;letter-spacing:.01em}
.flap .w{display:inline-block;white-space:nowrap}.flap .w span{display:inline-block}
.flap span.m{color:#e9c9cc;opacity:.75}.flap span{transition:color .12s}
.revealBox{all:unset;box-sizing:border-box;cursor:pointer;width:100%;border:1.5px dashed #3a3334;border-radius:14px;padding:16px;text-align:center;color:#8d8386;font-size:13px;letter-spacing:.08em}
.revealBox.on{border-style:solid;border-color:#3a3334;color:#faf7f3;font-size:18px;letter-spacing:0;font-family:'Source Serif 4',Georgia,serif}
.board .field{color:#faf7f3;border-color:#3a3334;margin-top:0}
.board .keys button{background:#2c2627;color:#faf7f3}
.board .msg.ok{color:#9fd3b2}.board .msg.bad{color:#f0a7ac}
.go{all:unset;cursor:pointer;display:block;margin:22px auto 0;padding:15px 38px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;letter-spacing:.06em;font-size:14px;box-shadow:0 10px 24px rgba(158,48,57,.28)}
.go:active{transform:translateY(1px)}
.sm{display:flex;justify-content:center;gap:10px;margin-top:12px}
.about{margin-top:48px;color:var(--muted);font-size:13.5px;line-height:1.6;text-align:center}.about h2{font-size:14px;color:var(--ink);font-weight:600;margin:0 0 6px}.about a{color:var(--accent)}.by{margin-top:10px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.note a{color:var(--muted)}
</style>
</head>

let H=Object.assign({src:"mix",show:"lv",mode:"flip",sfx:"on"},store.get("lv-home",{})),hc=null,hn=0,flapT=[];
const ALPHA="AĀBCČDEĒFGĢHIĪJKĶLĻMNŅOPRSŠTUŪVZŽ";
function randItem(){for(let k=0;k<8;k++){const i=Math.floor(Math.random()*M.length),m=M[i];
  const pool=H.src==="words"?m.w.filter(x=>x[0].split(" ").length<3):H.src==="sent"?m.s:[...m.w,...m.s];if(!pool.length)continue;
  const c=pool[Math.floor(Math.random()*pool.length)];if(due(c[0])||k>5)return{c,i}}return{c:M[0].w[0],i:0}}
let AC=null;
function tick(t0,i){const c=AC,len=.018,b=c.createBuffer(1,Math.floor(c.sampleRate*len),c.sampleRate),d=b.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,3);
 const src=c.createBufferSource();src.buffer=b;const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=2600+Math.random()*900;f.Q.value=1.4;const g=c.createGain();g.gain.value=.05*(1-i*.06);src.connect(f).connect(g).connect(c.destination);src.start(t0)}
function scrambleSound(ms){if(H.sfx==="off")return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const n=Math.min(9,Math.max(3,Math.round(ms/45)));for(let i=0;i<n;i++)tick(AC.currentTime+i*ms/1000/n,i)}catch(e){}}
function flapIn(el,text,done){flapT.forEach(clearTimeout);flapT=[];el.innerHTML="";const sp=[];text.normalize("NFC").split(" ").forEach((word,wi,arr)=>{const w=document.createElement("span");w.className="w";[...word].forEach(ch=>{const s=document.createElement("span");s.textContent=ch;s.className="m";w.appendChild(s);sp.push([s,ch])});el.appendChild(w);if(wi<arr.length-1)el.appendChild(document.createTextNode(" "))});
 const per=Math.max(6,Math.min(14,260/sp.length)),total=sp.length*per+90;
 sp.forEach(([s,ch],idx)=>{const rnd=()=>{const r=ALPHA[Math.floor(Math.random()*ALPHA.length)];return ch===ch.toUpperCase()?r:r.toLowerCase()};if(/[\p{L}]/u.test(ch))s.textContent=rnd();
  flapT.push(setTimeout(()=>{if(/[\p{L}]/u.test(ch))s.textContent=rnd()},idx*per+40));
  flapT.push(setTimeout(()=>{s.textContent=ch;s.className=""},idx*per+90))});
 scrambleSound(total);if(done)flapT.push(setTimeout(done,total+60))}
function seg(key,opts){return `<div class="seg" data-k="${key}">${opts.map(([v,l])=>`<button data-v="${v}" class="${H[key]===v?"on":""}">${l}</button>`).join("")}</div>`}
function home(next){if(next||!hc){hc=randItem();hn++}const{c,i}=hc,front=H.show==="lv"?c[0]:c[1],back=H.show==="lv"?c[1]:c[0];
 $("home").innerHTML=`<div class="ctrl">${seg("src",[["mix","Mixed"],["words","Words"],["sent","Sentences"]])}${seg("show",[["lv","Latvian"],["en","English"]])}${seg("mode",[["flip","Flip"],["type","Type"]])}</div>
 <div class="board"><div class="bt"><span>${String(hn).padStart(2,"0")} · ${dots(c[0])}</span><span><span class="chip">${esc(M[i].t)}</span><button class="spk sfx" id="sfx" title="Flip sound">${H.sfx==="off"?"♪̸":"♪"}</button>${spk(c[0])}</span></div>
 <div class="flapline"><div class="flap" id="flap"></div></div>
 ${H.mode==="flip"?`<button class="revealBox" id="rv">▸ REVEAL TRANSLATION</button>`:`<input class="field" id="in" placeholder="Type the ${H.show==="lv"?"English":"Latvian"}…" autocomplete="off" autocapitalize="off" spellcheck="false">${H.show==="en"?`<div class="keys" id="k"></div>`:""}<div class="msg" id="m" style="text-align:center"></div>`}
 </div><div class="sm" id="sm"></div><button class="go" id="go">↻&nbsp; NEXT CARD</button>`;
 preload(c[0]);flapIn($("flap"),front,()=>{if(H.show==="lv")say(c[0])});
 $("home").querySelectorAll(".seg").forEach(s=>s.onclick=e=>{const b=e.target.closest("button");if(!b)return;H[s.dataset.k]=b.dataset.v;store.set("lv-home",H);home(s.dataset.k==="src")});
 $("go").onclick=()=>home(true);$("sfx").onclick=e=>{e.stopPropagation();H.sfx=H.sfx==="off"?"on":"off";store.set("lv-home",H);e.currentTarget.textContent=H.sfx==="off"?"♪̸":"♪";e.currentTarget.style.opacity=H.sfx==="off"?.45:1};
 const graded=ok=>{grade(c[0],ok);home(true)};
 if(H.mode==="flip"){$("rv").onclick=()=>{const r=$("rv");if(r.classList.contains("on"))return;r.classList.add("on");r.textContent=back;if(H.show==="en")say(c[0]);
   $("sm").innerHTML=`<button class="btn" id="no">Again</button><button class="btn" id="yes">Got it</button>`;$("no").onclick=()=>graded(false);$("yes").onclick=()=>graded(true)}}
 else{const inp=$("in"),m=$("m");inp.focus();if($("k"))"āčēģīķļņšūž".split("").forEach(ch=>{const b=document.createElement("button");b.textContent=ch;b.onclick=()=>{inp.value+=ch;inp.focus()};$("k").appendChild(b)});
   let done=false;inp.onkeydown=e=>{if(e.key!=="Enter")return;if(done)return home(true);if(!inp.value.trim())return;done=true;
    const tgt=back,ok=strip(inp.value)===strip(tgt)||norm(inp.value)===norm(tgt)||(H.show==="lv"&&tgt.toLowerCase().split(/[\/(]/)[0].trim()===inp.value.trim().toLowerCase());
    m.className="msg "+(ok?"ok":"bad");m.innerHTML=(ok?"✓ ":"")+esc(tgt)+"<div style='font-size:12px;opacity:.6;margin-top:4px'>Enter for next</div>";grade(c[0],ok);say(c[0])}}}
head();render();note();home();
</script>
